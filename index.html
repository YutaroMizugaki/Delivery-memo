<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>納品書メーカー | Delivery Memo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header no-print">
      <div class="header-inner">
        <h1 class="logo">
          <span class="logo-icon">📋</span>
          納品書メーカー
        </h1>
        <div class="header-actions">
          <button type="button" id="btn-new" class="btn btn-ghost">新規作成</button>
          <button type="button" id="btn-save" class="btn btn-secondary">下書き保存</button>
          <button type="button" id="btn-print" class="btn btn-primary">印刷 / PDF</button>
        </div>
      </div>
    </header>

    <main class="main">
      <aside class="sidebar no-print">
        <section class="panel">
          <h2 class="panel-title">発行元情報</h2>
          <div class="form-group">
            <label for="issuer-name">会社名・屋号</label>
            <input type="text" id="issuer-name" placeholder="株式会社サンプル">
          </div>
          <div class="form-group">
            <label for="issuer-address">住所</label>
            <textarea id="issuer-address" rows="2" placeholder="〒100-0001&#10;東京都千代田区千代田1-1"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="issuer-tel">電話番号</label>
              <input type="tel" id="issuer-tel" placeholder="03-1234-5678">
            </div>
            <div class="form-group">
              <label for="issuer-email">メール</label>
              <input type="email" id="issuer-email" placeholder="info@example.com">
            </div>
          </div>
          <div class="form-group">
            <label for="issuer-registration">適格請求書登録番号</label>
            <input type="text" id="issuer-registration" placeholder="T1234567890123">
          </div>
          <button type="button" id="btn-save-issuer" class="btn btn-ghost btn-sm">発行元を保存</button>
        </section>

        <section class="panel">
          <h2 class="panel-title">納品先</h2>
          <div class="form-group">
            <label for="recipient-name">会社名・氏名</label>
            <input type="text" id="recipient-name" placeholder="株式会社クライアント">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="recipient-honorific">敬称</label>
              <select id="recipient-honorific">
                <option value="御中">御中</option>
                <option value="様">様</option>
                <option value="">なし</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recipient-contact">担当者</label>
              <input type="text" id="recipient-contact" placeholder="山田 太郎">
            </div>
          </div>
          <div class="form-group">
            <label for="recipient-address">住所</label>
            <textarea id="recipient-address" rows="2" placeholder="納品先住所"></textarea>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">書類情報</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="issue-date">発行日</label>
              <input type="date" id="issue-date">
            </div>
            <div class="form-group">
              <label for="doc-number">納品書番号</label>
              <input type="text" id="doc-number" placeholder="DN-20260101-001">
            </div>
          </div>
          <div class="form-group">
            <label for="po-number">注文番号（任意）</label>
            <input type="text" id="po-number" placeholder="PO-12345">
          </div>
          <div class="form-group">
            <label for="subject">件名</label>
            <input type="text" id="subject" placeholder="Webサイト制作 納品分">
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="show-prices" checked>
              金額を表示する
            </label>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="show-tax" checked>
              消費税を表示する
            </label>
          </div>
        </section>
      </aside>

      <div class="preview-area">
        <article class="document" id="document">
          <header class="doc-header">
            <h2 class="doc-title">納 品 書</h2>
            <div class="doc-meta">
              <table class="meta-table">
                <tr>
                  <th>発行日</th>
                  <td id="preview-date">—</td>
                </tr>
                <tr>
                  <th>納品書No.</th>
                  <td id="preview-number">—</td>
                </tr>
                <tr id="preview-po-row" class="hidden">
                  <th>注文番号</th>
                  <td id="preview-po">—</td>
                </tr>
              </table>
            </div>
          </header>

          <div class="doc-parties">
            <div class="recipient-block">
              <p class="recipient-name">
                <span id="preview-recipient">株式会社クライアント</span>
                <span id="preview-honorific" class="honorific">御中</span>
              </p>
              <p id="preview-contact" class="recipient-contact hidden"></p>
              <p id="preview-recipient-address" class="recipient-address"></p>
            </div>
            <div class="issuer-block">
              <p class="issuer-name" id="preview-issuer">株式会社サンプル</p>
              <p class="issuer-detail" id="preview-issuer-address"></p>
              <p class="issuer-detail" id="preview-issuer-tel"></p>
              <p class="issuer-detail" id="preview-issuer-email"></p>
              <p class="issuer-detail" id="preview-issuer-registration"></p>
            </div>
          </div>

          <p class="doc-subject" id="preview-subject"></p>

          <p class="doc-intro">下記の通り納品いたしましたので、ご査収くださいますようお願い申し上げます。</p>

          <div class="items-section">
            <table class="items-table" id="items-table">
              <thead>
                <tr>
                  <th class="col-no">No.</th>
                  <th class="col-desc">品名・仕様</th>
                  <th class="col-qty">数量</th>
                  <th class="col-unit price-col">単価</th>
                  <th class="col-amount price-col">金額</th>
                </tr>
              </thead>
              <tbody id="items-body">
              </tbody>
            </table>
          </div>

          <div class="totals-block price-section" id="totals-block">
            <table class="totals-table">
              <tr>
                <th>小計</th>
                <td id="preview-subtotal">¥0</td>
              </tr>
              <tr id="tax-row">
                <th>消費税（10%）</th>
                <td id="preview-tax">¥0</td>
              </tr>
              <tr class="total-row">
                <th>合計</th>
                <td id="preview-total">¥0</td>
              </tr>
            </table>
          </div>

          <div class="remarks-section no-print-editor">
            <label for="remarks" class="remarks-label no-print">備考</label>
            <textarea id="remarks" class="remarks-input no-print" rows="3" placeholder="納品に関する備考があれば入力してください"></textarea>
            <div class="remarks-print" id="preview-remarks"></div>
          </div>

          <div class="stamp-area">
            <div class="stamp-box">
              <span>印</span>
            </div>
          </div>
        </article>

        <section class="items-editor no-print">
          <div class="items-editor-header">
            <h3>明細行</h3>
            <button type="button" id="btn-add-item" class="btn btn-secondary btn-sm">+ 行を追加</button>
          </div>
          <div id="items-editor-list" class="items-editor-list"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="js/app.js"></script>
</body>
</html>
